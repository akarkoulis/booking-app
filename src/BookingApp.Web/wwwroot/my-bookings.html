<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My bookings · Workplace booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="/css/site.css" rel="stylesheet">
  <script type="module" src="/js/my-bookings.js"></script>
</head>
<body>
  <a href="#main" class="visually-hidden-focusable">Skip to content</a>
  <header class="border-bottom"><nav aria-label="Main" data-navigation class="container nav align-items-center gap-2 py-2"></nav></header>
  <main id="main" class="container py-4">
    <h1>My bookings</h1>
    <p data-time-zone class="text-body-secondary"></p>
    <div data-errors class="alert alert-danger" role="alert" aria-live="assertive" tabindex="-1" hidden></div>
    <p id="page-status" role="status" aria-live="polite">Loading…</p>
    <button id="refresh" type="button" class="btn btn-outline-secondary mb-3" disabled>Refresh bookings</button>
    <section aria-labelledby="upcoming-heading"><h2 id="upcoming-heading" class="h4">Upcoming and current</h2><div id="upcoming" class="row g-3"></div></section>
    <section class="mt-4" aria-labelledby="past-heading"><h2 id="past-heading" class="h4">Past</h2><div id="past" class="row g-3"></div></section>
    <section class="mt-4" aria-labelledby="cancelled-heading"><h2 id="cancelled-heading" class="h4">Cancelled</h2><div id="cancelled" class="row g-3"></div></section>
    <noscript>Enable JavaScript to view your bookings.</noscript>
  </main>
</body>
</html>
