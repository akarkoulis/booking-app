<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users · Workplace booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="/css/site.css" rel="stylesheet">
  <script type="module" src="/js/users.js"></script>
</head>
<body>
  <a href="#main" class="visually-hidden-focusable">Skip to content</a>
  <header class="border-bottom"><nav aria-label="Main" data-navigation class="container nav align-items-center gap-2 py-2"></nav></header>
  <main id="main" class="container py-4">
    <h1>Users</h1>
    <div data-errors class="alert alert-danger" role="alert" aria-live="assertive" tabindex="-1" hidden></div>
    <p id="page-status" role="status" aria-live="polite">Loading…</p>
    <div id="admin-content" hidden>

      <button id="new-user" type="button" class="btn btn-primary mb-3">Add user</button>
      <div class="table-responsive"><table class="table table-striped align-middle"><caption>Users</caption><thead><tr><th scope="col">Name</th><th scope="col">Email</th><th scope="col">Role</th><th scope="col">Status</th><th scope="col">Action</th></tr></thead><tbody id="users-body"></tbody></table></div>
      <section id="user-editor" class="mt-4" hidden aria-labelledby="user-heading">
        <h2 id="user-heading" class="h4">Add user</h2>
        <form id="user-form" novalidate><div data-errors class="alert alert-danger" role="alert" aria-live="assertive" tabindex="-1" hidden></div><fieldset id="user-fields"><legend class="visually-hidden">User details</legend><div class="row">
        <div class="col-md-6 mb-3"><label for="email" class="form-label">Email</label>
<input id="email" name="email" type="email" class="form-control" autocomplete="off">
</div>
        <div class="col-md-6 mb-3"><label for="displayName" class="form-label">Display name</label>
<input id="displayName" name="displayName" type="text" class="form-control" >
</div>
        <div class="col-md-6 mb-3"><label for="role" class="form-label">Role</label><select id="role" name="role" class="form-select"><option value="Employee">Employee</option><option value="Admin">Admin</option></select></div>
        <div id="password-group" class="col-md-6 mb-3"><label for="password" class="form-label">Password</label><div class="input-group has-validation">
<input id="password" name="password" type="password" autocomplete="new-password" class="form-control" aria-describedby="password-help">
              <button id="toggle-password" type="button" class="btn btn-outline-secondary" aria-label="Show password"
                aria-pressed="false" aria-controls="password">
                <span data-icon="show"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                    fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16" aria-hidden="true">
                    <path
                      d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z" />
                    <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0" />
                  </svg></span>
                <span data-icon="hide" hidden><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                    fill="currentColor" class="bi bi-eye-slash" viewBox="0 0 16 16" aria-hidden="true">
                    <path
                      d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7 7 0 0 0-2.79.588l.77.771A6 6 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755q-.247.248-.517.486z" />
                    <path
                      d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829" />
                    <path
                      d="M3.35 5.47q-.27.24-.518.487A13 13 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7 7 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12z" />
                  </svg></span>
              </button>
</div><div id="password-help" class="form-text">At least 8 characters. Used only when creating a user.</div></div>
        </div><div id="active-group"><div class="form-check mb-3"><input id="isActive" name="isActive" type="checkbox" class="form-check-input" checked><label for="isActive" class="form-check-label">Active</label></div></div><p id="own-access-help" class="form-text" hidden>You cannot change your own role or active status.</p>
        <button type="submit" class="btn btn-primary">Save user</button><button id="close-user" type="button" class="btn btn-outline-secondary ms-2">Close form</button>
        </fieldset></form>
      </section>
    </div>
    <noscript>Enable JavaScript to use this page.</noscript>
  </main>
</body>
</html>
